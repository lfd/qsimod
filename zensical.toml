# Documentation site. Build: uv run --extra docs zensical build --clean --strict
# Serve: uv run --extra docs zensical serve
# `mkdocstrings` renders the API reference from the docstrings.

[project]
site_name = "Q-SiMod"
site_description = "A typed metamodel for model-driven engineering of quantum simulations"
site_url = "https://lfd.github.io/qsimod/"
docs_dir = "docs"
site_dir = "site"

nav = [
  { Overview = "index.md" },
  { "The Layers" = "layers.md" },
  { Guides = [
    { "The Lattice Schwinger Model" = "schwinger.md" },
    { "The Heisenberg Magnet" = "heisenberg.md" },
    { "The Ising Chain, on a Shared Device" = "ising.md" },
  ] },
  { "API Reference" = [
    { Overview = "api/index.md" },
    { "Declaration Layer" = "api/declaration.md" },
    { "Structural Layer" = "api/structural.md" },
    { "Solving Layer" = "api/solving.md" },
    { "Realisation Layer" = "api/realise.md" },
    { "Model Library" = "api/models.md" },
    { "Transformation Library" = "api/transformations.md" },
    { "Use Cases" = "api/usecases.md" },
  ] },
]

# MathJax, for the equations `pymdownx.arithmatex` rewrites. The loader is
# ordered first so that `window.MathJax` is set before the library reads it.
extra_javascript = [
  "javascripts/mathjax.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js",
]

[project.theme]
features = [
  "navigation.sections",
  "navigation.top",
  "content.code.copy",
  "toc.permalink",
]

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "table"
show_root_heading = true
show_root_full_path = false
show_source = false
show_signature_annotations = true
separate_signature = true
members_order = "source"
filters = ["!^_"]
heading_level = 3

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
# Generic mode emits `\(...\)` for MathJax rather than relying on a
# preview script, so the `$...$` of the sources renders here and on GitHub.
pymdownx.arithmatex.generic = true
# The mermaid custom fence renders the figures on the site as well as on GitHub.
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
