# The test suite.
#
#   uv run pytest                     # the whole suite
#   uv run pytest -m "not slow"       # skip the documentation build and the wheel build
#
# Split across two jobs: the fast tests over every supported Python version,
# and the slow ones once. Lint, formatting and type checking live in
# quality.yml; the documentation site build and deployment live in docs.yml.
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from requires-python, up to the newest version the lock covers.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        # The slow tests are a separate job; they are version-independent.
        run: uv run pytest -m "not slow"

  engineering:
    name: Slow tests (docs and wheel build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Run the slow tests
        # --extra docs so the zensical build test runs instead of skipping.
        run: uv run --extra docs pytest -m slow
